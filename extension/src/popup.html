<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header class="hdr">
    <div class="logo"></div>
    <div>
      <div class="hdr-title">Foevo</div>
      <div class="hdr-sub">Heatmap &amp; analisi AI</div>
    </div>
    <button id="settings-btn" class="icon-btn" title="Impostazioni" aria-label="Impostazioni">⚙</button>
  </header>

  <!-- MAIN -->
  <section id="view-main" class="view">
    <label class="lbl" for="goal">Obiettivo della pagina <span class="muted">(opzionale)</span></label>
    <select id="goal" class="input">
      <option value="">Rileva automaticamente</option>
      <option value="lead">Generare lead / iscrizioni</option>
      <option value="sale">Vendita diretta / checkout</option>
      <option value="product">Scheda prodotto e-commerce</option>
      <option value="booking">Prenotazione / appuntamento</option>
      <option value="signup">Registrazione / trial</option>
    </select>

    <label class="lbl" for="note">Contesto <span class="muted">(opzionale)</span></label>
    <input id="note" class="input" type="text" maxlength="140" placeholder="es. audience freddo da Meta Ads" />

    <button id="analyze-btn" class="btn btn-primary">Analizza questa pagina</button>

    <div id="status" class="status" hidden>
      <div class="spinner"></div>
      <span id="status-text">Cattura in corso…</span>
    </div>
    <p id="error" class="error" hidden></p>
    <p class="tier-hint" id="tier-hint"></p>
  </section>

  <!-- SETTINGS / LOGIN -->
  <section id="view-settings" class="view" hidden>
    <label class="lbl" for="email">Email Foevo</label>
    <input id="email" class="input" type="email" placeholder="tu@esempio.com" autocomplete="email" />

    <!-- passo 2: codice ricevuto via email -->
    <div id="code-step" hidden>
      <label class="lbl" for="code">Codice ricevuto via email</label>
      <input id="code" class="input code-input" type="text" inputmode="numeric" autocomplete="one-time-code"
             placeholder="000000" />
      <a href="#" id="change-email" class="link">Usa un&rsquo;altra email</a>
    </div>

    <a id="signup-link" class="link" target="_blank">Non hai un account? Registrati &rarr;</a>

    <div class="row">
      <button id="save-settings" class="btn btn-primary">Invia codice</button>
      <button id="back-btn" class="btn btn-ghost">Indietro</button>
    </div>
    <p id="settings-saved" class="ok" hidden>Connesso &#10003;</p>
  </section>

  <footer class="ftr">
    <span id="acct" class="muted"></span>
    <a href="#" id="dashboard-link" target="_blank">Le mie analisi →</a>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
